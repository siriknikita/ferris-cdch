[package]
name = "cdch-bench"
description = "Differential testing, profiling and benchmarking utilities for Project Ferris"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cdch-core.workspace = true
cdch-features.workspace = true
# The public facade is checked against the oracle as well.
ferris-cdch.workspace = true
# Shared PNG decoding (cdch_cli::read_png).
cdch-cli = { path = "../cdch-cli" }
# JSON reports and the oracle wire protocol. `float_roundtrip` makes number parsing
# correctly rounded (the default fast path can be off by one ulp, which the harness's
# exact centre-echo check detected).
serde_json = { workspace = true, features = ["float_roundtrip"] }
# Lossless PNG decoding for natural-image fixtures (pure Rust).
png.workspace = true
# Batch-throughput measurements.
rayon.workspace = true

[[bin]]
name = "ferris-diff"
path = "src/bin/ferris_diff.rs"

[[bin]]
name = "ferris-bench"
path = "src/bin/ferris_bench.rs"
