[project]
name = "sr-zero-shot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.7.1", "torchvision==0.22.1", "timm==1.0.15",
  "numpy==2.3.5", "scipy==1.17.0", "scikit-learn==1.8.0",
  "pillow==13.0.0", "matplotlib==3.10.8", "joblib==1.5.3",
]

[tool.uv.sources]
torch = [{index = "pytorch-cpu", marker = "sys_platform == 'linux'"}]
torchvision = [{index = "pytorch-cpu", marker = "sys_platform == 'linux'"}]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
