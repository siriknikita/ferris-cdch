# An independent project that uses Ferris exactly as an unrelated application would:
# through a Git dependency on the public `ferris-cdch` crate, with no access to the
# Ferris workspace. `[workspace]` makes this directory its own workspace root.
#
# The dependency below is the published form (`cargo run` works as is).
# scripts/verify_independent_consumer.sh builds the same project against a fresh clone of
# any revision (it rewrites the URL in a temporary copy), e.g. before tagging.
[package]
name = "ferris-independent-consumer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ferris-cdch = { git = "https://github.com/siriknikita/ferris-cdch.git", tag = "v0.2.0" }

[workspace]
